application:
  name: standardnotes
  pods:
  - name: app
    image: standardnotes/server:latest
    path: /
    servicePorts:
    - 3000
    vars:
      DB_HOST: mysql.pod
      DB_PORT: "3306"
      DB_DATABASE: standard_notes_db
      DB_USERNAME: std_notes_user
      DB_PASSWORD: changeme123
      DB_TYPE: mysql
      REDIS_HOST: redis.pod
      REDIS_PORT: "6379"
      CACHE_TYPE: redis
      AUTH_JWT_SECRET: "5a58148c546df8a819605dcba3a6205fd0ba5ecfc90608865fcb209706fbaaad"
      VALET_TOKEN_SECRET: "a1f2f51fd658246202269aa2c5f4e4bb55aaafaf0fab715caf963d360b40be93"
      AUTH_SERVER_ENCRYPTION_SERVER_KEY: "2cf69fbb0e40b1ea1f81b741706ffefde91903e17b0a9c24f898aa405e79ecf8"
  - name: mysql
    image: mysql:8
    servicePorts:
    - 3306
    vars:
      MYSQL_DATABASE: standard_notes_db
      MYSQL_USER: std_notes_user
      MYSQL_PASSWORD: changeme123
      MYSQL_ROOT_PASSWORD: changeme123
  - name: redis
    image: redis:7-alpine
    servicePorts:
    - 6379
