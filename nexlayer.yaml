application:
  name: standardnotes
  pods:
  - name: app
    image: standardnotes/server:latest
    path: /
    servicePorts:
    - 3000
    vars:
      RAILS_ENV: production
      SECRET_KEY_BASE: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
      DB_HOST: mysql.pod
      DB_PORT: "3306"
      DB_DATABASE: sn
      DB_USERNAME: sn
      DB_PASSWORD: sn
      REDIS_URL: "redis://redis.pod:6379"
    volumes:
    - name: standardnotes-data
      mountPath: /opt/app/tmp
      size: 5Gi
  - name: mysql
    image: mysql:8
    servicePorts:
    - 3306
    vars:
      MYSQL_DATABASE: sn
      MYSQL_USER: sn
      MYSQL_PASSWORD: sn
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
    - name: sn-db
      mountPath: /var/lib/mysql
      size: 5Gi
  - name: redis
    image: redis:7-alpine
    servicePorts:
    - 6379
    volumes:
    - name: sn-redis
      mountPath: /data
      size: 2Gi
